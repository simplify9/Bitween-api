apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "project.fullname" . }}
  labels:
    app: {{ template "project.name" . }}
    chart: {{ template "project.chart" . }}
    draft: {{ .Values.draft | default "draft-app" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "project.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "project.name" . }}
        draft: {{ .Values.draft | default "draft-app" }}
        release: {{ .Release.Name }}
      annotations:
        buildID: {{ .Values.buildID | default "" | quote }}
    spec:
      {{- if .Values.hostAliases }}
      hostAliases:
        {{- range .Values.hostAliases }}
        - ip: {{ .ip }}
          hostnames:
          {{- range .hostNames }}
          - {{ . }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repo }}/{{ .Chart.Name }}:{{ .Chart.Version }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          {{- end }}

          env:

            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.global.environment }}

            - name: Infolink__DatabaseType
              value: {{ .Values.dbType }}

            - name: Infolink__AdminDatabaseName
              value: {{ .Values.adminDb }}

            - name: Infolink__DocumentPrefix
              value: {{ .Values.documentPrefix }}

            - name: Infolink__BusDefaultQueuePrefetch
              value: "{{ .Values.busDefaultQueuePrefetch }}"


            - name: Infolink__StorageProvider
              value: {{ .Values.storageProvider }}

            - name: Infolink__AreXChangeFilesPrivate
              value: "{{ .Values.areXChangeFilesPrivate }}"

            {{- if .Values.serverlessCommandTimeout }}
            - name: Infolink__ServerlessCommandTimeout
              value: "{{ .Values.serverlessCommandTimeout }}"
            {{- end }}

            - name: SwLogger__ApplicationName
              value: {{ template "project.fullname" . }}

            - name: SwLogger__ElasticsearchEnvironments
              value: {{ .Values.global.environment }}

            - name: InfolinkClient__BaseUrl
              value: http://{{ template "project.fullname" . }}/api/

            {{- if .Values.global.logger.esUrl }}
            - name: SwLogger__ElasticsearchUrl
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: esUrl
            {{- end }}

            {{- if .Values.global.logger.esUser }}
            - name: SwLogger__ElasticsearchUser
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: esUser
            {{- end }}

            {{- if .Values.global.logger.esPassword }}
            - name: SwLogger__ElasticsearchPassword
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: esPassword
            {{- end }}

            - name: {{ .Values.dbConnectionStringName }}
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: db

            - name: Infolink__MsalClientId
              value: {{ .Values.msalClientId }}

            - name: Infolink__MsalRedirectUri
              value: {{ .Values.msalRedirectUri }}
              
            - name: Infolink__MsalTenantId
              value: {{ .Values.msalTenantId }}
              
              
              
              
            {{- if .Values.global.cloudFiles.accessKeyId }}  
            - name: CloudFiles__AccessKeyId
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesAccessKeyId
            {{- end }}

            {{- if .Values.global.cloudFiles.secretAccessKey }}
            - name: CloudFiles__SecretAccessKey
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesSecretAccessKey
            {{- end }}
                
            {{- if .Values.global.cloudFiles.serviceUrl }}
            - name: CloudFiles__ServiceUrl
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesServiceUrl
            {{- end }}
                    
            {{- if .Values.global.cloudFiles.bucketName }}
            - name: CloudFiles__BucketName
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesBucketName

            {{- end }}
            
            {{- if .Values.global.cloudFiles.tenantId }}
            - name: CloudFiles__TenantId
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesTenantId
            {{- end }}
                
            {{- if .Values.global.cloudFiles.fingerPrint }}
            - name: CloudFiles__Fingerprint
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesFingerprint
            {{- end }}
                    
            {{- if .Values.global.cloudFiles.userId }}
            - name: CloudFiles__UserId
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesUserId
                  
            {{- end }}
              
            {{- if .Values.global.cloudFiles.rSAKey }}
            - name: CloudFiles__RSAKey
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesRSAKey
            {{- end }}
              
            {{- if .Values.global.cloudFiles.region }}
            - name: CloudFiles__Region
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesRegion
            {{- end }}
              
            {{- if .Values.global.cloudFiles.namespaceName }}
            - name: CloudFiles__NamespaceName
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesNamespaceName
            {{- end }}
              







            - name: ConnectionStrings__RabbitMQ
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: rabbitUrl

            - name: Token__Key
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: tokenKey

            - name: Token__Issuer
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: tokenIssuer

            - name: Token__Audience
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: tokenAudience



            {{- $root := . }}
            {{- range $key, $values := .Values.secrets }}

            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: {{ $key }}

            {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
#     {{- with .Values.imagePullSecrets }}
#       imagePullSecrets:
# {{ toYaml . | indent 8 }}
#     {{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
