apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "project.fullname" . }}
  labels:
    app: {{ template "project.name" . }}
    chart: {{ template "project.chart" . }}
    draft: {{ .Values.draft | default "draft-app" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ template "project.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "project.name" . }}
        draft: {{ .Values.draft | default "draft-app" }}
        release: {{ .Release.Name }}
        {{- range $key, $value := .Values.podLabels }}
        {{- if has $key (list "app" "draft" "release") }}
        {{- fail (printf "podLabels.%s is set by the chart and can't be overridden" $key) }}
        {{- end }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      annotations:
        buildID: {{ .Values.buildID | default "" | quote }}
    spec:
      {{- with .Values.serviceAccount.name }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- if .Values.hostAliases }}
      hostAliases:
        {{- range .Values.hostAliases }}
        - ip: {{ .ip }}
          hostnames:
          {{- range .hostNames }}
          - {{ . }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repo }}/{{ .Chart.Name }}:{{ .Chart.Version }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              # The port the app listens on. This said 80, so probes aimed at it could never pass.
              containerPort: 8080
              protocol: TCP
          {{- if .Values.probes.enabled }}
          # Startup covers the migrations a new version runs before it listens.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
          # Liveness asks only whether the process answers: a database blip must not restart pods.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Readiness also asks the database and RabbitMQ, so traffic waits until both are reachable.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}

          env:

            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.global.environment }}

            - name: Bitween__DatabaseType
              value: {{ .Values.dbType }}

            - name: Bitween__AdminDatabaseName
              value: {{ .Values.adminDb }}

            # Seeds the Settings table on the first boot only. Each exchange keeps the prefix its
            # files were written under, so it can be changed later under Settings → Documents & storage.
            - name: Bitween__DocumentPrefix
              value: {{ .Values.documentPrefix }}

            - name: Bitween__BusDefaultQueuePrefetch
              value: "{{ .Values.busDefaultQueuePrefetch }}"

            - name: Bitween__RabbitMqManagementUrl
              value: {{ .Values.environmentVariables.Bitween__RabbitMqManagementUrl | quote }}

            # From the chart's Secret rather than in the pod spec, where anyone who can read the
            # deployment could read it.
            - name: Bitween__RabbitMqManagementPassword
              {{- if .Values.environmentVariables.Bitween__RabbitMqManagementPassword }}
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: rabbitMqManagementPassword
              {{- else }}
              value: ""
              {{- end }}

            - name: Bitween__RabbitMqManagementUsername
              value: {{ .Values.environmentVariables.Bitween__RabbitMqManagementUsername | quote }}

            - name: Bitween__StorageProvider
              value: {{ .Values.storageProvider }}

            # The address partners reach this instance on, taken from the host name the Ingress or
            # HTTPRoute serves: an aggregation's handler may pass its roll-up's file links to a
            # partner, who has to be able to open them. https unless the Ingress has no TLS for it.
            {{- $publicHost := "" }}
            {{- $publicScheme := "https" }}
            {{- if .Values.gateway.enabled }}
            {{- $publicHost = first (.Values.gateway.hostnames | default list) }}
            {{- else if .Values.ingress.enabled }}
            {{- $publicHost = first (.Values.ingress.hosts | default list) }}
            {{- $publicScheme = "http" }}
            {{- range .Values.ingress.tls }}
            {{- if has $publicHost (.hosts | default list) }}
            {{- $publicScheme = "https" }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and $publicHost (not (hasPrefix "*" $publicHost)) }}
            - name: Bitween__PublicUrl
              value: {{ printf "%s://%s" $publicScheme $publicHost | quote }}
            {{- end }}

            - name: Bitween__UseAzureManagedIdentity
              value: "{{ .Values.useAzureManagedIdentity }}"

            {{- if .Values.serverlessCommandTimeout }}
            - name: Bitween__ServerlessCommandTimeout
              value: "{{ .Values.serverlessCommandTimeout }}"
            {{- end }}

            - name: SwLogger__ApplicationName
              value: {{ template "project.fullname" . }}

            - name: SwLogger__ElasticsearchEnvironments
              value: {{ .Values.global.environment }}

            - name: BitweenClient__BaseUrl
              value: http://{{ template "project.fullname" . }}/api/

            {{- if .Values.global.logger.esUrl }}
            - name: SwLogger__ElasticsearchUrl
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: esUrl
            {{- end }}

            {{- if .Values.global.logger.esUser }}
            - name: SwLogger__ElasticsearchUser
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: esUser
            {{- end }}

            {{- if .Values.global.logger.esPassword }}
            - name: SwLogger__ElasticsearchPassword
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: esPassword
            {{- end }}

            - name: {{ .Values.dbConnectionStringName }}
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: db

            # As with Bitween__DocumentPrefix above, these three seed the Settings table on
            # the first boot only. Editing them later has no effect — change Microsoft sign-on
            # under Settings → Single sign-on (Microsoft).
            - name: Bitween__MsalClientId
              value: {{ .Values.msalClientId }}

            - name: Bitween__MsalRedirectUri
              value: {{ .Values.msalRedirectUri }}

            - name: Bitween__MsalTenantId
              value: {{ .Values.msalTenantId }}
              
              
              
              
            {{- if .Values.global.cloudFiles.accessKeyId }}  
            - name: CloudFiles__AccessKeyId
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesAccessKeyId
            {{- end }}

            {{- if .Values.global.cloudFiles.secretAccessKey }}
            - name: CloudFiles__SecretAccessKey
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesSecretAccessKey
            {{- end }}
                
            {{- if .Values.global.cloudFiles.serviceUrl }}
            - name: CloudFiles__ServiceUrl
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesServiceUrl
            {{- end }}
                    
            {{- if .Values.global.cloudFiles.bucketName }}
            - name: CloudFiles__BucketName
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesBucketName

            {{- end }}
            
            {{- if .Values.global.cloudFiles.tenantId }}
            - name: CloudFiles__TenantId
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesTenantId
            {{- end }}
                
            {{- if .Values.global.cloudFiles.fingerPrint }}
            - name: CloudFiles__Fingerprint
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesFingerprint
            {{- end }}
                    
            {{- if .Values.global.cloudFiles.userId }}
            - name: CloudFiles__UserId
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesUserId
                  
            {{- end }}
              
            {{- if .Values.global.cloudFiles.rSAKey }}
            - name: CloudFiles__RSAKey
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesRSAKey
            {{- end }}
              
            {{- if .Values.global.cloudFiles.region }}
            - name: CloudFiles__Region
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesRegion
            {{- end }}
              
            {{- if .Values.global.cloudFiles.namespaceName }}
            - name: CloudFiles__NamespaceName
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: cloudFilesNamespaceName
            {{- end }}
              







            - name: ConnectionStrings__RabbitMQ
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: rabbitUrl

            - name: Token__Key
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: tokenKey

            - name: Token__Issuer
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: tokenIssuer

            - name: Token__Audience
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" . }}
                  key: tokenAudience



            {{- $root := . }}
            {{- range $key, $values := .Values.secrets }}

            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ template "project.fullname" $root }}
                  key: {{ $key }}

            {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
#     {{- with .Values.imagePullSecrets }}
#       imagePullSecrets:
# {{ toYaml . | indent 8 }}
#     {{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
{{- end }}
