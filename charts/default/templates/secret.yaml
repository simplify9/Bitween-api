apiVersion: v1
kind: Secret
metadata:
  name: {{ template "project.fullname" . }}
data:
  db: {{ .Values.db | b64enc }} 
  tokenKey: {{ .Values.global.token.key | b64enc }} 
  tokenIssuer: {{ .Values.global.token.issuer | b64enc }} 
  tokenAudience: {{ .Values.global.token.audience | b64enc }} 
  rabbitUrl: {{ .Values.global.bus.rabbitUrl | b64enc }}
  
  {{- if .Values.global.cloudFiles.accessKeyId }}
  cloudFilesAccessKeyId: {{ .Values.global.cloudFiles.accessKeyId | b64enc }}
  {{- end }}
  
  {{- if .Values.global.cloudFiles.secretAccessKey }}
  cloudFilesSecretAccessKey: {{ .Values.global.cloudFiles.secretAccessKey | b64enc }}
  {{- end }}
  
  {{- if .Values.global.cloudFiles.serviceUrl }}
  cloudFilesServiceUrl: {{ .Values.global.cloudFiles.serviceUrl | b64enc }}
  {{- end }}
  
  {{- if .Values.global.cloudFiles.bucketName }}
  cloudFilesBucketName: {{ .Values.global.cloudFiles.bucketName | b64enc }}
  {{- end }}
  
  {{- if .Values.global.cloudFiles.tenantId }}
  cloudFilesTenantId: {{ .Values.global.cloudFiles.tenantId | b64enc }}
  {{- end }}

  {{- if .Values.global.cloudFiles.fingerPrint }}
  cloudFilesFingerprint: {{ .Values.global.cloudFiles.fingerPrint | b64enc }}
  {{- end }}

  {{- if .Values.global.cloudFiles.userId }}
  cloudFilesUserId: {{ .Values.global.cloudFiles.userId | b64enc }}
  {{- end }}

  {{- if .Values.global.cloudFiles.rSAKey }}
  cloudFilesRSAKey: {{ .Values.global.cloudFiles.rSAKey | b64enc }}
  {{- end }}

  {{- if .Values.global.cloudFiles.region }}
  cloudFilesRegion: {{ .Values.global.cloudFiles.region | b64enc }}
  {{- end }}

  {{- if .Values.global.cloudFiles.namespaceName }}
  cloudFilesNamespaceName: {{ .Values.global.cloudFiles.namespaceName | b64enc }}
  {{- end }}
  
  
  
  {{- if .Values.global.logger.esUrl }}
  esUrl: {{ .Values.global.logger.esUrl | b64enc }}
  {{- end }}

  {{- if .Values.global.logger.esUser }}
  esUser: {{ .Values.global.logger.esUser | b64enc }}
  {{- end }}

  {{- if .Values.global.logger.esPassword }}
  esPassword: {{ .Values.global.logger.esPassword | b64enc }}
  {{- end }}

  {{- $root := . }}
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}


