name: Bitween API CI/CD
run-name: Run-${{ github.ref_name }}-${{ github.run_number }}

on:
  push:
    branches:
      - releases/**
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  dotnet:
    name: Build, test and pack NuGet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SW.Bitween.sln

      - name: Build
        run: dotnet build SW.Bitween.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SW.Bitween.UnitTests/SW.Bitween.UnitTests.csproj --configuration Release --no-build

      - name: Pack SDK NuGet
        run: dotnet pack SW.Bitween.Sdk/SW.Bitween.Sdk.csproj --configuration Release --no-build -p:PackageVersion=8.0.${{ github.run_number }}

  deploy-release:
    name: Build, push image/chart and deploy to playground
    if: ${{ (github.event_name == 'push' && github.ref_name == 'releases/r8.0') || github.event_name == 'workflow_dispatch' }}
    uses: simplify9/.github/.github/workflows/sw-cicd.yml@main
    with:
      major-version: '8'
      minor-version: '1'

      dockerfile-path: './Dockerfile'
      docker-context: '.'
      docker-platforms: 'linux/amd64'

      chart-name: 'bitween'
      chart-path: './charts/default'

      chart-publish-method: 'chartmuseum'
      chart-repo-url: 'https://charts.sf9.io'

      deploy-to-development: true
      development-namespace: 'playground'

      container-registry: 'docker.io'
      image-name: 'simplify9/bitween'

      helm-set-values: 'ingress.enabled=true,ingress.hosts={app-dev.bitween.io},ingress.path=/api,global.environment=Development,ingress.tls[0].secretName=bitween-tls,ingress.tls[0].hosts={app-dev.bitween.io},ingress.annotations.kubernetes\\.io/ingress\\.class=nginx,ingress.annotations.cert-manager\\.io/cluster-issuer=letsencrypt-nginx'
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

      chartmuseum-username: ${{ secrets.CM_USER }}
      chartmuseum-password: ${{ secrets.CM_PASSWORD }}

      kubeconfig: ${{ secrets.S9DEV_KUBECONFIG }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

      helm-set-secret-values: 'db=${{ secrets.dbConnection }},global.bus.rabbitUrl=${{ secrets.rabbitUrl }},global.cloudFiles.secretAccessKey=${{ secrets.SecretAccessKey }},global.cloudFiles.accessKeyId=${{ secrets.AccessKeyId }},global.cloudFiles.serviceUrl=${{ secrets.ServiceUrl }},global.cloudFiles.bucketName=${{ secrets.BucketName }},Bitween.RabbitMqManagementUrl=${{ secrets.RabbitMqManagementUrl }},Bitween.RabbitMqManagementPassword=${{ secrets.RabbitMqManagementPassword }},Bitween.RabbitMqManagementUsername=${{ secrets.RabbitMqManagementUsername }}'
