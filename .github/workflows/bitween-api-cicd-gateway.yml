name: Bitween API CI/CD (Gateway · both)
run-name: Run-${{ github.ref_name }}-${{ github.run_number }}

on:
  push:
    branches:
      - releases/**
  workflow_dispatch:

# One queue for staging AND release, not one per branch. Both jobs below take their patch from
# the same 10.0.x git tags and push the same docker.io/simplify9/bitween:10.0.<patch> image tag,
# and a run only claims its patch when it tags at the very end. Two runs overlapping (a staging
# push, then the staging -> r10.0 merge seconds later) would compute the same patch: the image
# tag is overwritten by whichever finishes last, while ChartMuseum (409 = success) and NuGet
# (--skip-duplicate) silently keep whichever came first.
concurrency:
  group: cicd-gateway-bitween-10.0
  cancel-in-progress: false

# contents: write -> tag job. packages: write -> publish AND pull the Helm chart
# via GHCR OCI. The Docker image and the SDK NuGet package go to Docker Hub / the
# NuGet feed respectively.
permissions:
  contents: write
  packages: write
  security-events: read

jobs:
  build-publish-deploy:
    # Staging: build, publish to GHCR only, deploy to playground (or any branch, manually).
    if: ${{ (github.event_name == 'push' && github.ref_name == 'releases/r10.0-staging') || github.event_name == 'workflow_dispatch' }}
    uses: simplify9/.github/.github/workflows/reusable-service-cicd.yml@main
    with:
      major-version: '10'
      minor-version: '0'
      dotnet-version: '10.0.x'

      dockerfile-path: './Dockerfile'
      docker-context: '.'
      docker-platforms: 'linux/amd64'

      chart-name: 'bitween'                 # must match charts/default Chart.yaml name:
      chart-path: './charts/default'

      # 1) Publish the Helm chart to GHCR OCI only. ChartMuseum is what clients install from,
      # so only the release job below publishes there; staging versions are plain x.y.z and
      # would otherwise be the newest chart a client gets.
      chart-publish-method: 'github-oci'

      # Docker image stays on Docker Hub
      container-registry: 'docker.io'
      image-name: 'simplify9/bitween'

      # Build + unit-test + push the SDK NuGet package (versioned with the
      # pipeline semver, e.g. 8.1.x — was 8.0.<run_number> in the old job),
      # and the adapter contract package (SimplyWorks.Bitween.Adapters) adapters reference.
      nuget-projects: >-
        SW.Bitween.Sdk/SW.Bitween.Sdk.csproj
        SW.Bitween.Adapters/SW.Bitween.Adapters.csproj
      run-tests: 'true'
      # Integration tests run against real Postgres/RabbitMQ/MailHog via
      # Testcontainers — self-contained, no extra CI services needed, since
      # ubuntu-latest already has a Docker daemon available.
      test-projects: |
        SW.Bitween.UnitTests/SW.Bitween.UnitTests.csproj
        SW.Bitween.IntegrationTests/SW.Bitween.IntegrationTests.csproj

      # 2) Deploy to playground via Gateway API
      deploy: true
      # 3) Pull the chart from GHCR OCI
      deploy-chart-source: 'github-oci'
      deploy-namespace: 'playground'
      routing-mode: 'gateway-api'
      gateway-hostnames: 'app-dev.bitween.io'
      # '/' serves the admin SPA out of this image's wwwroot, so the root has to route
      # here too — previously only /api and /swagger did, leaving the root on the retired
      # legacy Bitween-UI deployment and making every deploy look like the UI never changed.
      gateway-paths: '/,/api,/swagger'
      # app-dev.bitween.io is not *.sf9.io, so the deploy auto-onboards a
      # dedicated listener + cert-manager Certificate on the parent gateway
      # (public-gateway · s9-dev-edge · cilium · letsencrypt-production-gateway).

      # Non-routing chart values (routing itself is generated by gateway-api mode).
      helm-set-values: |
        global.environment=Development
        resources.requests.cpu=25m
        resources.requests.memory=704Mi
        resources.limits.memory=1408Mi
    secrets:
      # Docker image push credentials (Docker Hub)
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GHCR chart push + pull and git tagging use the built-in token
      github-token: ${{ secrets.GITHUB_TOKEN }}

      # NuGet API key for the SDK package push (publishes to nuget.org, the
      # reusable's default feed — no nuget-source override needed).
      nuget-api-key: ${{ secrets.SWNUGETKEY }}

      # Gateway-API cluster kubeconfig (V2)
      kubeconfig-gateway: ${{ secrets.S9DEV_KUBECONFIG_V2 }}

      dependabot-alerts-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}

      # App configuration passed to helm --set-string during deploy (masked)
      #
      # global.token.key signs every authentication token. The chart still carries a sample
      # key as its default, and that value is published in this public repository — anyone
      # holding it can mint a token for any identity, so the app refuses to start on it.
      # Set the TokenKey secret to a long random string unique to this environment
      # (openssl rand -base64 48). Changing it signs out everyone holding an older token.
      helm-set-secret-values: 'global.token.key=${{ secrets.TokenKey }},db=${{ secrets.dbConnection }},global.bus.rabbitUrl=${{ secrets.rabbitUrl }},global.cloudFiles.secretAccessKey=${{ secrets.SecretAccessKey }},global.cloudFiles.accessKeyId=${{ secrets.AccessKeyId }},global.cloudFiles.serviceUrl=${{ secrets.ServiceUrl }},global.cloudFiles.bucketName=${{ secrets.BucketName }},environmentVariables.Bitween__RabbitMqManagementUrl=${{ secrets.RabbitMqManagementUrl }},environmentVariables.Bitween__RabbitMqManagementPassword=${{ secrets.RabbitMqManagementPassword }},environmentVariables.Bitween__RabbitMqManagementUsername=${{ secrets.RabbitMqManagementUsername }}'

  publish-release:
    # Release: build and publish to ChartMuseum for clients, never deploy. releases/r10.0 is the
    # repository's default branch, so the reusable workflow treats it as a release: a clean
    # 10.0.<patch> git tag, and the critical Dependabot gate runs first.
    if: ${{ github.event_name == 'push' && github.ref_name == 'releases/r10.0' }}
    uses: simplify9/.github/.github/workflows/reusable-service-cicd.yml@main
    with:
      major-version: '10'
      minor-version: '0'
      dotnet-version: '10.0.x'

      dockerfile-path: './Dockerfile'
      docker-context: '.'
      docker-platforms: 'linux/amd64'

      chart-name: 'bitween'
      chart-path: './charts/default'
      chart-publish-method: 'chartmuseum'
      chart-repo-url: 'https://charts.sf9.io'

      container-registry: 'docker.io'
      image-name: 'simplify9/bitween'

      # The SDK and the adapter contract package (SimplyWorks.Bitween.Adapters) adapters reference.
      nuget-projects: >-
        SW.Bitween.Sdk/SW.Bitween.Sdk.csproj
        SW.Bitween.Adapters/SW.Bitween.Adapters.csproj
      run-tests: 'true'
      test-projects: |
        SW.Bitween.UnitTests/SW.Bitween.UnitTests.csproj
        SW.Bitween.IntegrationTests/SW.Bitween.IntegrationTests.csproj
      # deploy is left at its default, false: the deploy job never runs, so no kubeconfig
      # or app secrets are passed.
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
      chartmuseum-username: ${{ secrets.CM_USER }}
      chartmuseum-password: ${{ secrets.CM_PASSWORD }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
      nuget-api-key: ${{ secrets.SWNUGETKEY }}
      dependabot-alerts-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
