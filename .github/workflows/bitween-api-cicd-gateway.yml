name: Bitween API CI/CD (Gateway · both)
run-name: Run-${{ github.ref_name }}-${{ github.run_number }}

# Two pipelines that publish nothing under the same name:
#   releases/r10.0-develop  the simplify9/bitween-develop image and the bitween-develop chart,
#                           deployed to bitween-dev on the dev cluster (app-dev.bitween.io). No NuGet
#                           packages, the CLI as a pre-release.
#   releases/r10.0          the simplify9/bitween image and the bitween chart clients install
#                           (ChartMuseum + GHCR), the NuGet packages, the CLI and the SDKs, deployed
#                           to bitween on the production cluster (app.bitween.io).
# Run workflow by hand on either branch to rerun that branch's pipeline.
on:
  push:
    branches:
      - releases/r10.0
      - releases/r10.0-develop
  workflow_dispatch:

# One queue per branch. Both pipelines still take their patch from the same 10.0.x git tags, so a
# develop run and a release run that overlap can compute the same patch, but they publish it under
# different names (bitween-develop / bitween, cli-v10.0.N-dev.<run> / cli-v10.0.N, git tag
# 10.0.N-releases-r10-0-develop.<run> / 10.0.N), so nothing is overwritten or silently kept. One
# queue for both would be worse: GitHub keeps a single pending run per group, so a develop push
# would cancel a release waiting behind another develop run.
concurrency:
  group: cicd-gateway-bitween-${{ github.ref_name }}
  cancel-in-progress: false

# contents: write -> tag job. packages: write -> publish AND pull the Helm chart
# via GHCR OCI. The Docker image and the SDK NuGet package go to Docker Hub / the
# NuGet feed respectively.
permissions:
  contents: write
  packages: write
  security-events: read

jobs:
  build-publish-deploy:
    # Develop: build, publish bitween-develop, deploy to bitween-dev.
    if: ${{ github.ref_name == 'releases/r10.0-develop' }}
    uses: simplify9/.github/.github/workflows/reusable-service-cicd.yml@main
    with:
      major-version: '10'
      minor-version: '0'
      dotnet-version: '10.0.x'

      dockerfile-path: './Dockerfile'
      docker-context: '.'
      docker-platforms: 'linux/amd64'

      # The production chart, published as bitween-develop: rename-chart sets Chart.yaml's name
      # at package time, so develop and production ship from one chart directory and cannot drift.
      chart-name: 'bitween-develop'
      chart-path: './charts/default'
      rename-chart: true
      # ChartMuseum to install it by hand, GHCR for the deploy below.
      chart-publish-method: 'both'
      chart-repo-url: 'https://charts.sf9.io'

      # The chart's image is <image.repo>/<chart name>:<version>, so the image is named after
      # the chart. Its own repository also keeps develop off simplify9/bitween:latest.
      container-registry: 'docker.io'
      image-name: 'simplify9/bitween-develop'

      # No nuget-projects: develop publishes no packages. The tests still run (build and test,
      # no pack); as before, a failure does not hold back the deploy.
      run-tests: 'true'
      test-projects: |
        SW.Bitween.UnitTests/SW.Bitween.UnitTests.csproj
        SW.Bitween.IntegrationTests/SW.Bitween.IntegrationTests.csproj

      # Deploy to bitween-dev via Gateway API
      deploy: true
      # Pull the chart from GHCR OCI
      deploy-chart-source: 'github-oci'
      deploy-namespace: 'bitween-dev'
      # Release bitween with nameOverride=bitween (helm-set-values), so every resource name and
      # selector is what the bitween chart renders in production. Gateway API gives a hostname to
      # its oldest HTTPRoute: any other release serving app-dev.bitween.io on this cluster keeps
      # the host until it is uninstalled.
      deploy-release-name: 'bitween'
      routing-mode: 'gateway-api'
      gateway-hostnames: 'app-dev.bitween.io'
      # '/' serves the admin SPA out of this image's wwwroot, so the root has to route
      # here too - previously only /api and /swagger did, leaving the root on the retired
      # legacy Bitween-UI deployment and making every deploy look like the UI never changed.
      gateway-paths: '/,/api,/swagger'
      # Attach to the dev gateway's *.bitween.io wildcard listener (public-gateway · s9-dev-edge),
      # certificate included, instead of onboarding a listener and certificate for the host. The
      # deploy fails before helm runs if the listener is missing. An app-dev.bitween.io listener on
      # that gateway would take the host from the wildcard and answer 404, since this route no
      # longer attaches to it.
      gateway-section-name: 'https-wildcard-bitween-io'

      # Non-routing chart values (routing itself is generated by gateway-api mode). Every line is
      # handed to helm --set as it stands, so no comments inside. replicaCount=2: the lab's phase 6
      # kills one mid-traffic, and anything that runs on every replica at once (scheduled jobs, data
      # source leases) shows up here first.
      # AWS_*_CHECKSUM_*=when_required: an experiment for S3-compatible stores. Since AWSSDK.S3 3.7.410
      # uploads are aws-chunked with a trailing checksum, which such stores save into the object
      # (the lab's S3 invoices arrive starting "C3;chunk-signature=..."). The lasting fix belongs
      # in SW-CloudFiles; this shows on staging whether the SDK default is the cause.
      helm-set-values: |
        nameOverride=bitween
        global.environment=Development
        replicaCount=2
        resources.requests.cpu=25m
        resources.requests.memory=704Mi
        resources.limits.memory=1408Mi
        environmentVariables.Bitween__BusProvidersEnabled=true
        environmentVariables.AWS_REQUEST_CHECKSUM_CALCULATION=when_required
        environmentVariables.AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
    secrets:
      # Docker image push credentials (Docker Hub)
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
      chartmuseum-username: ${{ secrets.CM_USER }}
      chartmuseum-password: ${{ secrets.CM_PASSWORD }}

      # GHCR chart push + pull and git tagging use the built-in token
      github-token: ${{ secrets.GITHUB_TOKEN }}

      # Gateway-API cluster kubeconfig (V2)
      kubeconfig-gateway: ${{ secrets.S9DEV_KUBECONFIG_V2 }}

      dependabot-alerts-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}

      # App configuration passed to helm --set-string during deploy (masked)
      #
      # global.token.key signs every authentication token. The chart still carries a sample
      # key as its default, and that value is published in this public repository - anyone
      # holding it can mint a token for any identity, so the app refuses to start on it.
      # Set the TokenKey secret to a long random string unique to this environment
      # (openssl rand -base64 48). Changing it signs out everyone holding an older token.
      helm-set-secret-values: 'global.token.key=${{ secrets.TokenKey }},db=${{ secrets.dbConnection }},global.bus.rabbitUrl=${{ secrets.rabbitUrl }},global.cloudFiles.secretAccessKey=${{ secrets.SecretAccessKey }},global.cloudFiles.accessKeyId=${{ secrets.AccessKeyId }},global.cloudFiles.serviceUrl=${{ secrets.ServiceUrl }},global.cloudFiles.bucketName=${{ secrets.BucketName }},environmentVariables.Bitween__RabbitMqManagementUrl=${{ secrets.RabbitMqManagementUrl }},environmentVariables.Bitween__RabbitMqManagementPassword=${{ secrets.RabbitMqManagementPassword }},environmentVariables.Bitween__RabbitMqManagementUsername=${{ secrets.RabbitMqManagementUsername }}'

  publish-release:
    # Release: build and publish for clients, deploy production. releases/r10.0 is the
    # repository's default branch, so the reusable workflow treats it as a release: a clean
    # 10.0.<patch> git tag, and the critical Dependabot gate runs first.
    if: ${{ github.ref_name == 'releases/r10.0' }}
    uses: simplify9/.github/.github/workflows/reusable-service-cicd.yml@main
    with:
      major-version: '10'
      minor-version: '0'
      dotnet-version: '10.0.x'

      dockerfile-path: './Dockerfile'
      docker-context: '.'
      docker-platforms: 'linux/amd64'

      chart-name: 'bitween'
      chart-path: './charts/default'
      # ChartMuseum, where clients install from today, and GHCR OCI (oci://ghcr.io/simplify9/charts/bitween),
      # the same versions as an immutable, digest-pinned mirror.
      chart-publish-method: 'both'
      chart-repo-url: 'https://charts.sf9.io'

      container-registry: 'docker.io'
      image-name: 'simplify9/bitween'

      nuget-projects: 'SW.Bitween.Sdk/SW.Bitween.Sdk.csproj'
      run-tests: 'true'
      # Integration tests run against real Postgres/RabbitMQ/MailHog via
      # Testcontainers - self-contained, no extra CI services needed, since
      # ubuntu-latest already has a Docker daemon available.
      test-projects: |
        SW.Bitween.UnitTests/SW.Bitween.UnitTests.csproj
        SW.Bitween.IntegrationTests/SW.Bitween.IntegrationTests.csproj
      # Deploy to bitween on the production cluster. Off until the repository variable
      # BITWEEN_PROD_DEPLOY is 'true': first the PROD_* secrets below must exist,
      # S9PROD_KUBECONFIG_V2 must be shared with this repository, and app.bitween.io must
      # point at the production gateway. Without them a deploy installs a release with no
      # database, or fails waiting for its certificate.
      deploy: ${{ vars.BITWEEN_PROD_DEPLOY == 'true' }}
      deploy-chart-source: 'github-oci'
      deploy-namespace: 'bitween'
      deploy-environment: 'production'
      routing-mode: 'gateway-api'
      gateway-hostnames: 'app.bitween.io'
      gateway-paths: '/,/api,/swagger'
      # The production cluster's gateway. The default, s9-dev-edge, does not exist there, and
      # the deploy would create a second public-gateway in it instead of failing.
      gateway-parent-namespace: 's9-prod-edge'
      # The production gateway's *.bitween.io wildcard listener, as on develop.
      gateway-section-name: 'https-wildcard-bitween-io'
      # Every line is handed to helm --set as it stands, so no comments inside.
      # AWS_*_CHECKSUM_*=when_required: production stores files in DigitalOcean Spaces too, so it
      # carries develop's checksum setting (see the note there) until the fix lands in SW-CloudFiles.
      helm-set-values: |
        global.environment=Production
        replicaCount=2
        resources.requests.cpu=25m
        resources.requests.memory=704Mi
        resources.limits.memory=1408Mi
        environmentVariables.Bitween__BusProvidersEnabled=true
        environmentVariables.AWS_REQUEST_CHECKSUM_CALCULATION=when_required
        environmentVariables.AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
      chartmuseum-username: ${{ secrets.CM_USER }}
      chartmuseum-password: ${{ secrets.CM_PASSWORD }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
      nuget-api-key: ${{ secrets.SWNUGETKEY }}
      dependabot-alerts-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}

      # Production cluster kubeconfig (V2, Gateway API)
      kubeconfig-gateway: ${{ secrets.S9PROD_KUBECONFIG_V2 }}

      # Production's own configuration, the same settings as the develop job's above. PROD_TOKENKEY
      # is its own random string (openssl rand -base64 48), never the develop key.
      helm-set-secret-values: 'global.token.key=${{ secrets.PROD_TOKENKEY }},db=${{ secrets.PROD_DBCONNECTION }},global.bus.rabbitUrl=${{ secrets.PROD_RABBITURL }},global.cloudFiles.secretAccessKey=${{ secrets.PROD_SECRETACCESSKEY }},global.cloudFiles.accessKeyId=${{ secrets.PROD_ACCESSKEYID }},global.cloudFiles.serviceUrl=${{ secrets.PROD_SERVICEURL }},global.cloudFiles.bucketName=${{ secrets.PROD_BUCKETNAME }},environmentVariables.Bitween__RabbitMqManagementUrl=${{ secrets.PROD_RABBITMQMANAGEMENTURL }},environmentVariables.Bitween__RabbitMqManagementPassword=${{ secrets.PROD_RABBITMQMANAGEMENTPASSWORD }},environmentVariables.Bitween__RabbitMqManagementUsername=${{ secrets.PROD_RABBITMQMANAGEMENTUSERNAME }}'
