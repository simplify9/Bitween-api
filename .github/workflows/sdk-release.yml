name: SDK release

# Publishes the adapter contract for Python to PyPI as simplyworks-bitween and for JavaScript and
# TypeScript to npm as @simplyworks/bitween. Never run by hand or by a tag: the release run on
# releases/r10.0 (bitween-api-cicd-gateway.yml) calls it with the version it computed, so they carry
# Bitween's version. Only a release version is published. Each is tested first against
# SW-Serverless's SDK from its default branch, and a version already on its registry is left alone,
# so a failed run can simply be run again.
on:
  workflow_call:
    inputs:
      version:
        description: "The version the calling run computed"
        type: string
        required: true

permissions:
  contents: read

jobs:
  python:
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: simplify9/SW-Serverless
          path: sw-serverless
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="$VERSION"
          sed -i -E "s/^version = \".*\"/version = \"$v\"/" pyproject.toml
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$v\"/" src/simplyworks_bitween/__init__.py
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Test
        run: PYTHONPATH="src:$GITHUB_WORKSPACE/sw-serverless/sdk/python/src" python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  node:
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: simplify9/SW-Serverless
          path: sw-serverless
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="$VERSION"
          npm version "$v" --no-git-tag-version --allow-same-version
          sed -i -E "s/^const VERSION = \".*\";/const VERSION = \"$v\";/" src/index.js
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Test
        env:
          SW_SERVERLESS_NODE: ${{ github.workspace }}/sw-serverless/sdk/node/src
        run: node --test
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "$name@${{ steps.version.outputs.value }} is already on npm."
          else
            npm publish --access public
          fi
