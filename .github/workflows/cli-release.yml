name: bitween CLI release

# A tag cli-v<version> (cli-v10.0.60) publishes the bitween command as self-contained
# binaries on a GitHub release: nothing needs .NET installed to run them.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 10.0.60 (tagged cli-v<version>)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64, win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Version
        id: version
        run: |
          v="${{ github.event.inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME#cli-v}"
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Publish
        run: >
          dotnet publish SW.Bitween.Cli -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }} -o out
      - name: Package
        run: |
          mkdir -p dist
          cp docs/cli.md out/README.md 2>/dev/null || true
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            (cd out && zip -q -r ../dist/bitween-${{ matrix.rid }}.zip .)
          else
            tar -czf dist/bitween-${{ matrix.rid }}.tar.gz -C out .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bitween-${{ matrix.rid }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ github.event.inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME#cli-v}"
          gh release create "cli-v$v" dist/* --title "bitween CLI $v" --target "${{ github.sha }}" \
            --notes "The bitween command, self-contained for each platform. Install: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/scripts/install-cli.sh | sh — or download the archive for your platform and check it against SHA256SUMS."
