<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Signing in…</title>
  </head>
  <body>
    <!--
      Where the Microsoft sign-in popup lands, and the URL to register as the
      Azure AD redirect URI. Azure AD sends the popup here with `#code=…` in the
      fragment; the window that opened it polls the popup's URL for that fragment
      (@azure/msal-browser PopupClient.monitorPopupForHash) and then closes it.

      This must not be the app itself: index.html boots the SPA, RequireAuth finds
      no session and does `<Navigate to="/login" replace>`, and that navigation
      drops the fragment before the opener can read it - leaving the popup sitting
      on a login page and the sign-in failing. Keep this page empty and
      script-free; nothing here has to run for the flow to complete.
    -->
  </body>
</html>
